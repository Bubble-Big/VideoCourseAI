server.port=9090

# ==========================================
# Profile 配置（激活本地配置文件）
# ==========================================
spring.profiles.active=local

# 数据库配置 (端口映射到宿主机)
spring.datasource.url=jdbc:mysql://localhost:3307/media_db?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8&allowPublicKeyRetrieval=true

spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ????
spring.servlet.multipart.max-file-size=2048MB
spring.servlet.multipart.max-request-size=2048MB

# ????
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# ==============================
# AI 模型配置 (SiliconFlow)
# ==============================
# API 密钥在 application-local.properties 中配置（不提交到 Git）
ai.deepseek.base-url=https://api.siliconflow.cn/v1
ai.deepseek.model=deepseek-ai/DeepSeek-V3.2
ai.asr.url=https://api.siliconflow.cn/v1/audio/transcriptions
ai.asr.model=TeleAI/TeleSpeechASR


# ==========================================
# Redis ?? (????)
# ==========================================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.database=0
spring.data.redis.timeout=3000ms


# ==========================================
# MinIO ?? (????)
# ==========================================
# localhost 改 127.0.0.1（Windows Docker IPv6 回环兼容）
minio.endpoint=http://127.0.0.1:9000
minio.accessKey=minioadmin
minio.secretKey=minioadmin
minio.bucketName=media


# ==========================================
# 外部工具路径
# ==========================================
# 工具路径在 application-local.properties 中配置（不提交到 Git）
# 请复制 application-local.properties.example 为 application-local.properties 并修改


# ================= RocketMQ ?? =================
# ?????? Docker ???????
rocketmq.name-server=127.0.0.1:9876
# ??????????????
rocketmq.producer.group=video-analysis-group
# ?????? (??)
rocketmq.producer.send-message-timeout=3000

# ================= AI analysis compensation retry =================
# stall threshold in minutes (must exceed max execution time ~15min)
ai.compensation.threshold-minutes=20
# max attempts before marking FAILED
ai.compensation.max-attempts=3
# analysis lock wait seconds: 抢不到内容锁时等待首个持锁任务完成以便复用结果（对齐 ASR readTimeout，非无限等待）
ai.analysis-lock-wait-seconds=600
# transcribe lock wait seconds: 抢不到转写锁时等待他人转写完成以便复用结果（对齐 ASR readTimeout）
ai.transcribe-lock-wait-seconds=600

# ================= AI rate limit (per minute) =================
ai.rate-limit.ai-user-per-minute=5
ai.rate-limit.ai-global-per-minute=30
ai.rate-limit.transcribe-user-per-minute=10
ai.rate-limit.transcribe-global-per-minute=60